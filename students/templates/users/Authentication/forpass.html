{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .container {
      max-width: 420px;
      margin-top: 100px;
    }

    .form-container {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    }

    .logo {
      display: block;
      margin: 0 auto 20px auto;
      width: 80px;
    }

    .message {
      margin-top: 15px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body class="bg-light">

  <div class="container">
    <div class="form-container">
      <!-- Logo -->
      <img src="{% static 'logimages/logo.png' %}" alt="Logo" class="logo">

      <h3 class="text-center mb-3 fw-bold">Forgot Password</h3>
      <p class="text-center text-muted small">
        Enter your registered email. We’ll send you a One-Time Password (OTP) to reset your account.
      </p>

      <form id="forgotForm">
        {% csrf_token %}
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email</label>
          <input 
            type="email" 
            class="form-control rounded-pill" 
            id="email" 
            name="email" 
            placeholder="yourname@university.edu"
            required
          >
          <input type="hidden" id="csrf_token" value="{{ csrf_token }}">
        </div>
        <button type="submit" class="btn btn-primary w-100 rounded-pill">
          Send OTP
        </button>
      </form>

      <!-- Message -->
      <div class="message text-center fw-semibold" id="responseMessage"></div>
    </div>
  </div>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const csrfToken = document.getElementById('csrf_token').value;
      const messageDiv = document.getElementById('responseMessage');

      messageDiv.textContent = "⏳ Processing...";
      messageDiv.className = "message text-center text-muted fw-semibold";

      try {
        const response = await fetch("{% url 'forpass' %}", {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': csrfToken,
          },
          body: `email=${encodeURIComponent(email)}`
        });

        const data = await response.json();

        if (data.status === 'otp_sent' || data.status === 'success') {
          messageDiv.textContent = data.message;
          messageDiv.className = "message text-center text-success fw-semibold";
          setTimeout(() => {
            window.location.href = "{% url 'verify_reset_otp' %}";
          }, 1200);
        } else {
          messageDiv.textContent = data.message;
          messageDiv.className = "message text-center text-danger fw-semibold";
        }
      } catch (err) {
        messageDiv.textContent = '❌ Something went wrong. Please try again.';
        messageDiv.className = "message text-center text-danger fw-semibold";
      }
    });
  </script>

</body>
</html>
