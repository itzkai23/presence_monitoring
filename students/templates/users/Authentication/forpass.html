{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .container {
      max-width: 400px;
      margin-top: 100px;
    }

    .form-container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
    }

    .message {
      margin-top: 15px;
    }

    .logo {
      display: block;
      margin: 0 auto 20px auto;
      width: 80px;
    }
  </style>
</head>
<body class="bg-light">

  <div class="container">
    <div class="form-container">
      <!-- Logo -->
      <img src="{% static 'images/logo.png' %}" alt="Logo" class="logo">

      <h3 class="text-center mb-3">Forgot Password</h3>
      <form id="forgotForm">
        {% csrf_token %}
        <div class="mb-3">
          <label for="email" class="form-label">Enter your registered email</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="Enter your university email" required>
          <input type="hidden" id="csrf_token" value="{{ csrf_token }}">
        </div>
        <button type="submit" class="btn btn-primary w-100">Submit</button>
      </form>
      <div class="message text-center" id="responseMessage"></div>
    </div>
  </div>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const csrfToken = document.getElementById('csrf_token').value;
      const messageDiv = document.getElementById('responseMessage');

      try {
        const response = await fetch("{% url 'forpass' %}", {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': csrfToken,
          },
          body: `email=${encodeURIComponent(email)}`
        });

        const data = await response.json();

        if (data.status === 'otp_sent' || data.status === 'success') {
          messageDiv.textContent = data.message;
          messageDiv.classList.remove('text-danger');
          messageDiv.classList.add('text-success');
          setTimeout(() => {
            window.location.href = "{% url 'verify_reset_otp' %}";
          }, 1000);
        } else {
          messageDiv.textContent = data.message;
          messageDiv.classList.remove('text-success');
          messageDiv.classList.add('text-danger');
        }
      } catch (err) {
        messageDiv.textContent = 'Something went wrong.';
        messageDiv.classList.remove('text-success');
        messageDiv.classList.add('text-danger');
      }
    });
  </script>

</body>
</html>
