{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card shadow-lg border-0 p-4" style="max-width: 420px; width: 100%; border-radius: 1rem;">
    
    <!-- Logo -->
    <div class="text-center mb-4">
      <img src="{% static 'logimages/logo.png' %}" alt="Logo" width="70" class="mb-3">
      <h2 class="fw-bold text-primary">Admin Login</h2>
    </div>

    <!-- Error message -->
    {% if error %}
      <div class="alert alert-danger text-center py-2">{{ error }}</div>
    {% endif %}

    <!-- Form -->
    <form method="POST" novalidate>
      {% csrf_token %}

      <div class="form-floating mb-3">
        <input type="text" name="username" id="username" class="form-control rounded-3" placeholder="Username" required>
        <label for="username">Username</label>
      </div>

      <div class="form-floating mb-3 position-relative">
       <input type="password" name="password" id="password" class="form-control rounded-3" placeholder="Password" required>
      <label for="password">Password</label>
      <button type="button" id="togglePassword" class="btn btn-sm btn-outline-secondary position-absolute top-50 end-0 translate-middle-y me-2">
       <i id="eyeIcon" class="bi bi-eye-slash"></i>
      </button>
      </div>


      <div class="d-grid mb-3">
        <button type="submit" class="btn btn-primary btn-lg rounded-3">
          <i class="bi bi-box-arrow-in-right me-2"></i> Login
        </button>
      </div>
    </form>

  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const togglePassword = document.getElementById('togglePassword');
const passwordInput = document.getElementById('password');
const eyeIcon = document.getElementById('eyeIcon');

togglePassword.addEventListener('click', function () {
  const isHidden = passwordInput.type === 'password';
  passwordInput.type = isHidden ? 'text' : 'password';

  if (isHidden) {
    eyeIcon.classList.remove('bi-eye-slash');
    eyeIcon.classList.add('bi-eye');
  } else {
    eyeIcon.classList.remove('bi-eye');
    eyeIcon.classList.add('bi-eye-slash');
  }
});

</script>
{% endblock %}
