{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OTP Verification</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .otp-input {
      width: 3rem;
      height: 3rem;
      text-align: center;
      font-size: 1.5rem;
    }
    .logo {
      height: 90px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

  <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
    <div class="text-center mb-3">
      <img src="{% static 'images/logo.png' %}" alt="Logo" class="logo">
      <h4 class="fw-bold mb-2">Enter OTP</h4>
      <small class="text-muted">OTP sent to your email:</small><br>
      <small class="text-primary fw-semibold">{{ request.session.otp_email }}</small>
    </div>

    <form id="otp-form">
      <input type="hidden" id="csrf_token" value="{{ csrf_token }}">
      <div class="d-flex justify-content-between mb-3">
        {% for i in "123456" %}
          <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric"
            class="form-control otp-input border border-secondary rounded"
            required />
        {% endfor %}
      </div>

      <button type="submit" class="btn btn-primary w-100">Verify</button>
      <div id="message" class="text-center mt-3 fw-semibold small"></div>
    </form>
  </div>

  <script>
    const inputs = document.querySelectorAll('.otp-input');
    const messageEl = document.getElementById("message");
    const csrfToken = document.getElementById("csrf_token").value;

    // Auto-focus next input
    inputs.forEach((input, index) => {
      input.addEventListener('input', () => {
        if (input.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === "Backspace" && !input.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });

    document.getElementById('otp-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const enteredOTP = Array.from(inputs).map(input => input.value.trim()).join('');

      if (enteredOTP.length !== 6 || !/^\d{6}$/.test(enteredOTP)) {
        messageEl.textContent = "Please enter a valid 6-digit OTP.";
        messageEl.className = "text-danger text-center mt-3 fw-semibold small";
        return;
      }

      messageEl.textContent = "Verifying OTP...";
      messageEl.className = "text-secondary text-center mt-3 fw-semibold small";

      const response = await fetch("{% url 'verify_otp' %}", {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'X-CSRFToken': csrfToken
        },
        body: new URLSearchParams({
          otp: enteredOTP,
          email: "{{ request.session.otp_email }}"
        })
      });

      const data = await response.json();

      if (data.status === 'success') {
        messageEl.textContent = data.message;
        messageEl.className = "text-success text-center mt-3 fw-semibold small";
        setTimeout(() => {
          window.location.href = "{% url 'register_success' %}";
        }, 1500);
      } else {
        messageEl.textContent = data.message;
        messageEl.className = "text-danger text-center mt-3 fw-semibold small";
      }
    });
  </script>

</body>
</html>
