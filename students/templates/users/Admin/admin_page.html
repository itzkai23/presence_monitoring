{% extends 'base_admin.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'styles/admin_page.css' %}">
<style>
/* 🔹 Single Button Loading & Success Styles */
.admin-btn-loading {
  padding: 0.6rem 1.6rem;
  font-weight: 600;
  border-radius: 0.6rem;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  transition: all 0.25s ease-in-out;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  position: relative;
}

.admin-btn-loading:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(0,0,0,0.15);
}

.admin-btn-loading:disabled {
  opacity: 0.85;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* Processing spinner */
.processing-dots::after {
  content: "";
  display: inline-block;
  margin-left: 6px;
  width: 1rem;
  height: 1rem;
  border: 2px solid rgba(13,110,253,0.3);
  border-top: 2px solid #fff;
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
  vertical-align: middle;
}

/* Success state */
.btn-success-feedback {
  background-color: #198754 !important;
  border-color: #198754 !important;
  color: #fff !important;
  animation: pulse-success 1s ease;
}

/* Checkmark SVG */
.checkmark {
  width: 22px;
  height: 22px;
  stroke: #fff;
  stroke-width: 3;
}

.checkmark-circle {
  stroke-dasharray: 166;
  stroke-dashoffset: 166;
  stroke-width: 3;
  stroke: #fff;
  fill: none;
  animation: none;
}

.checkmark-check {
  stroke-dasharray: 48;
  stroke-dashoffset: 48;
  stroke-width: 3;
  stroke: #fff;
  animation: none;
}

.animate-check .checkmark-circle {
  animation: stroke 0.6s ease-in-out forwards;
}

.animate-check .checkmark-check {
  animation: stroke 0.4s ease-in-out 0.6s forwards;
}

/* Pending badge always on top-right corner of button */
.admin-btn-loading #pendingBadge {
  top: -6px;
  right: -6px;
}

@keyframes spin {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes pulse-success {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.05); }
  100% { transform: scale(1); }
}

@keyframes stroke {
  100% { stroke-dashoffset: 0; }
}
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">

  <!-- 🔹 Title & Single Generate Encodings Button -->
  <div class="text-center mb-4">
    <h2 class="fw-bold text-uppercase text-primary-emphasis">
      <i class="bi bi-person-lines-fill me-2"></i>
      Student Records
    </h2>
    <button id="generateEncBtn" class="admin-btn-loading" type="button">
      <span class="btn-text">Generate Encodings & Backup</span>
      <svg class="checkmark d-none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
        <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
        <path class="checkmark-check" fill="none" d="M14 27l7 7 16-16"/>
      </svg>
      <span id="pendingBadge"
            class="position-absolute translate-middle badge rounded-pill bg-danger"
            style="display: none;"></span>
    </button>
  </div>

  <!-- 🔍 Search Bar -->
  <div class="col-md-6 position-relative mb-3">
    <input type="text" id="studentSearchInput" class="form-control"
           placeholder="Search students by name, ID, email, or section...">
    <button id="clearSearch" type="button"
            class="btn position-absolute end-0 top-0 bottom-0 me-0"
            style="border: none; background: transparent; display: none;">
      <i class="bi bi-x-circle-fill text-secondary"></i>
    </button>
  </div>

  <!-- 📋 Student Table Container -->
  <div id="studentTableContainer" class="table-dark">
    <!-- Table will be dynamically injected via JS -->
  </div>
</div>

<!-- Camera modal remains unchanged -->
<div id="cameraModal" class="modal"
     style="display: none; position: fixed; z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            overflow: auto; background-color: rgba(0,0,0,0.8);
            justify-content: center; align-items: center;
            flex-direction: column; padding: 20px;">
  <!-- ... modal content ... -->
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'scripts/admin_page.js' %}"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const searchInput = document.getElementById("studentSearchInput");
  const clearBtn = document.getElementById("clearSearch");
  const generateBtn = document.getElementById("generateEncBtn");
  const btnText = generateBtn.querySelector(".btn-text");
  const checkmark = generateBtn.querySelector(".checkmark");
  const pendingBadge = document.getElementById("pendingBadge");

  // -----------------------------
  // Search Filter
  // -----------------------------
  searchInput.addEventListener("input", () => {
    clearBtn.style.display = searchInput.value ? "block" : "none";
    const query = searchInput.value.toLowerCase();
    const rows = document.querySelectorAll("#studentTableContainer tbody tr");
    rows.forEach(row => {
      row.style.display = row.innerText.toLowerCase().includes(query) ? "" : "none";
    });
  });

  clearBtn.addEventListener("click", () => {
    searchInput.value = "";
    clearBtn.style.display = "none";
    searchInput.focus();
  });

  // -----------------------------
  // Pending Encodings
  // -----------------------------
  function checkPendingEncodings() {
    fetch("{% url 'check_pending_encodings' %}", {
      method: "GET",
      headers: { "X-Requested-With": "XMLHttpRequest" }
    })
    .then(res => res.json())
    .then(data => {
      if (data.pending_count > 0) {
        pendingBadge.textContent = data.pending_count;
        pendingBadge.style.display = "inline-block";
      } else {
        pendingBadge.style.display = "none";
      }
    })
    .catch(err => console.error("Error checking pending encodings:", err));
  }

  // -----------------------------
  // Generate Encodings Button Logic
  // -----------------------------
  generateBtn.addEventListener("click", () => {
    btnText.textContent = "Processing";
    btnText.classList.add("processing-dots");
    checkmark.classList.add("d-none");
    generateBtn.disabled = true;

    fetch("{% url 'run_generate_encodings' %}", {
      method: "GET",
      headers: { "X-Requested-With": "XMLHttpRequest" }
    })
    .then(res => res.json())
    .then(data => {
      alert(data.message);
      checkPendingEncodings(); // refresh pending badge
      btnText.classList.remove("processing-dots");
      btnText.textContent = "Encoding Complete";
      generateBtn.classList.add("btn-success-feedback");
      checkmark.classList.remove("d-none");
      checkmark.classList.add("animate-check");
    })
    .catch(err => alert("Error: " + err))
    .finally(() => {
      setTimeout(() => {
        checkmark.classList.add("d-none");
        checkmark.classList.remove("animate-check");
        generateBtn.classList.remove("btn-success-feedback");
        btnText.textContent = "Generate Encodings & Backup";
        generateBtn.disabled = false;
      }, 2500);
    });
  });

  // Initial pending badge check
  checkPendingEncodings();
});
</script>
{% endblock %}
