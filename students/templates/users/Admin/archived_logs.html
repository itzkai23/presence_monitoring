{% extends 'base_admin.html' %}
{% load static %}

{% block title %}Archived Presence Logs{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'styles/presence_logs.css' %}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="text-center mb-4">
    <h2 class="fw-bold text-uppercase text-primary-emphasis">
      <i class="bi bi-box me-2"></i>Archived Presence Logs
    </h2>
  </div>  

  <input type="search" id="searchArchive" class="form-control mb-3" placeholder="Search archived records..." />

  <div class="table-responsive">
    <table class="table table-bordered table-hover align-middle">
      <thead class="table-dark text-center">
        <tr>
          <th>#</th>
          <th>Archived At</th>
          <th>Log Date</th>
          <th>Student ID</th>
          <th>Name</th>
          <th>Role</th>
          <th>Department</th>
          <th>Purpose</th>
        </tr>
      </thead>
      <tbody id="archiveTableBody">
        <!-- JS will populate this -->
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'scripts/archived_logs.js' %}"></script>
{% endblock %}
